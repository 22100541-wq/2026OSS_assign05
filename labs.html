<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function clickMe() {
        const Clickbt = document.querySelector("#Clickbt");
        Clickbt.innerText = "Clicked";
      }

      function checkForm(e) {
        const username =document.querySelector("#username");
        if(username.value == ''){
          alert("이름을 입력");
          username.focus();
          e.preventDefault();
        }
      }
      function clickME() {
        alert("validation");
      }
    
      window.addEventListener("load", function () {
        const btn1 = document.querySelector("#btn1");
        btn1.addEventListener("click", clickME);

        const form1 = document.querySelector("#form1");
        form1.addEventListener("submit", checkForm);


      });




      <!--동적 리스트-->
      function delul(e){
        e.target.parentElement.remove();

      }

      window.addEventListener("load",function(){
        const text=document.querySelector("#text");
        const bt=document.querySelector("#bt");
        const ul =document.querySelector("#ul");
      bt.addEventListener("click",function(){
        let flist= text.value.split(",");
        for(let i=0;i<flist.length; i++){
          const li =document.createElement("li");
          li.textContent=flist[i];
          ul.appendChild(li);


          const bt = document.createElement("button");
          bt.textContent="X";
          li.appendChild(bt);
          bt.addEventListener("click",delul);

        }
      });

      });
    </script>
  </head>
  <body>
    <!--동적 리스트-->
  
    <input id ="text" type="text" placeholder="과일을 입력하세요">
    <button id="bt">추가</button>
    <ul id="ul">
    </ul>
    



    <button id="btn2">Clikc Me</button>
    <form id="form1" action="Login_ok.html" method="post">
      <input
        id="username"
        type="text"
        name="username"
        placeholder="이름을 입력해라"
      />
      <input type="submit" value="로그인" />
    </form>

    <h3>window</h3>
    <button id="btn1">Chlick ME</button><br />

    
    <!--클릭버튼 실습2-->
    <h3>internal</h3>
    <button id="Clickbt2">Chlick ME</button><br />

    <!--클릭버튼 실습-->
    <h3>inline</h3>
    <button id="Clickbt" onclick="clickMe()">Chlick ME</button><br />

    <!--계산기-->
    <p1>덧셈 계산기</p1><br /><br />
    <input type="text" id="num1" size="4" />
    <input type="text" id="num2" size="4" />
    <button id="plus">+</button>
    <input id="result" />
    <script>
      const plus = document.querySelector("#plus");
      plus.addEventListener("click", function () {
        const num1 = document.querySelector("#num1").value;
        const num2 = document.querySelector("#num2").value;

        const result = Number(num1) + Number(num2);
        document.querySelector("#result").value = result;
      });
    </script>
  </body>
</html>
