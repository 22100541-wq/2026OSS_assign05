<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      let menus = [
        {
          id: 1,
          name: "오코노미야끼",
          category: "철판요리",
          price: 15000,
          quantity: 1,
          status: "판매중",
        },
        {
          id: 2,
          name: "가라야게",
          category: "튀김",
          price: 18000,
          quantity: 8,
          status: "판매중",
        },
        {
          id: 3,
          name: "사시미",
          category: "회",
          price: 55000,
          quantity: 18,
          status: "판매중",
        },
        {
          id: 4,
          name: "맥주 500cc",
          category: "주류",
          price: 5000,
          quantity: "1",
          status: "판매중",
        },
      ];

      window.addEventListener("load", function () {
        const form = document.querySelector("#menu");
        const name = document.querySelector("#name");
        const category = document.querySelector("#category");
        const price = document.querySelector("#price");
        const quantity = document.querySelector("#quantity");
        const selling = document.querySelector("#selling");
        const soldout = document.querySelector("#soldout");

        const table = document.querySelector("#table");

       for(let i=0; i<menus.length; i++){

    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = menus[i].id;
    tr.appendChild(td1);

    const td2 = document.createElement("td");
    td2.textContent = menus[i].name;
    tr.appendChild(td2);

    const td3 = document.createElement("td");
    td3.textContent = menus[i].category;
    tr.appendChild(td3);

    const td4 = document.createElement("td");
    td4.textContent = menus[i].price;
    tr.appendChild(td4);

    const td5 = document.createElement("td");
    td5.textContent = menus[i].quantity;
    tr.appendChild(td5);

    const td6 = document.createElement("td");
    td6.textContent = menus[i].status;
    tr.appendChild(td6);

    table.appendChild(tr);
}

        form.addEventListener("submit", function (e) {
          e.preventDefault();

          if (name.value === "") {
            alert("메뉴 이름을 입력하세요.");
            return;
          }

          if (category.value === "") {
            alert("종류를 입력하세요.");
            return;
          }

          if (price.value === "") {
            alert("가격을 입력하세요.");
            return;
          }

          if (quantity.value === "") {
            alert("수량을 입력하세요.");
            return;
          }


          if (selling.checked === false && soldout.checked === false) {
            alert("상태를 선택하세요.");
            return;
          }
           let statusValue = "";

          if(selling.checked){
            statusValue = selling.value;
          }

          if(soldout.checked){
            statusValue = soldout.value;
          }

          let newMenu = {
            id: menus.length + 1,
            name: name.value,
            category: category.value,
            price: price.value,
            quantity: quantity.value,
            status: statusValue,
          };

          menus.push(newMenu);
           
          for(let i=menu.length-1; i<menus.length; i++){

    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = menus[i].id;
    tr.appendChild(td1);

    const td2 = document.createElement("td");
    td2.textContent = menus[i].name;
    tr.appendChild(td2);

    const td3 = document.createElement("td");
    td3.textContent = menus[i].category;
    tr.appendChild(td3);

    const td4 = document.createElement("td");
    td4.textContent = menus[i].price;
    tr.appendChild(td4);

    const td5 = document.createElement("td");
    td5.textContent = menus[i].quantity;
    tr.appendChild(td5);

    const td6 = document.createElement("td");
    td6.textContent = menus[i].status;
    tr.appendChild(td6);

    table.appendChild(tr);
}


          

          console.log(menus);
        });
      });
    </script>
  </head>
  <body>
    <form id="menu">
      <label>메뉴 이름</label>
      <input type="text" id="name" /><br />

      <label>종류</label>
      <input type="text" id="category" /><br />

      <label>가격</label>
      <input type="number" id="price" /><br />

      <label>수량</label>
      <input type="number" id="quantity" /><br />

      <label>상태</label>
      <input type="radio" id="selling" name="status" value="판매중" />
      <label>판매중</label>
      <input type="radio" id="soldout" name="status" value="품절" />
      <label>품절</label><br />

      <button type="submit">추가</button>
    </form>

    <table id="table">
      <tr>
        <th>id</th>
        <th>이름</th>
        <th>종류</th>
        <th>가격</th>
        <th>수량</th>
        <th>상태</th>
      </tr>
      
    </table>
  </body>
</html>
